databases:
  - name: talent-finder-db
    databaseName: talentfinder
    user: talentfinder
    plan: free

services:
  - type: web
    name: talent-finder-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev is deliberate: NODE_ENV=production (set by Render for
    # web services regardless of what's declared here) makes a plain
    # `npm install` skip devDependencies — which silently drops typescript,
    # @types/*, and prisma before the build even runs. Build and start share
    # one environment on this plan (no separate prune-after-build stage), so
    # devDependencies must survive through both.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talent-finder-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://talent-finder-client.onrender.com
      # Optional AI Insight feature — left blank on purpose. Set the real
      # value in the Render dashboard (Environment tab) after first deploy;
      # never commit it here. Leaving it unset just disables that one bonus
      # endpoint (returns 503), core app works fine without it.
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini

  - type: web
    name: talent-finder-client
    runtime: static
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://talent-finder-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

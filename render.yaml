databases:
  - name: talent-finder-db
    databaseName: talentfinder
    user: talentfinder
    plan: free

services:
  - type: web
    name: talent-finder-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev is deliberate: NODE_ENV=production (set by Render for
    # web services regardless of what's declared here) makes a plain
    # `npm install` skip devDependencies — which silently drops typescript,
    # @types/*, and prisma before the build even runs. Build and start share
    # one environment on this plan (no separate prune-after-build stage), so
    # devDependencies must survive through both.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talent-finder-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://talent-finder-client.onrender.com
      # Signs login tokens. Render generates a random value once; it never
      # appears in the repo. The API refuses to start without it.
      - key: JWT_SECRET
        generateValue: true
      # First-run admin, for a free plan with no shell. Set both in the Render
      # dashboard (Environment tab); they are ignored once any user exists.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Optional Google sign-in: set all three in the dashboard to enable it.
      # GOOGLE_REDIRECT_URI = https://talent-finder-api.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Optional AI Insight feature — left blank on purpose. Set the real
      # value in the Render dashboard (Environment tab) after first deploy;
      # never commit it here. Leaving it unset just disables that one bonus
      # endpoint (returns 503), core app works fine without it.
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini

  - type: web
    name: talent-finder-client
    runtime: static
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://talent-finder-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers for the static site. The API sets its own (helmet) —
    # these are unrelated and don't need to match. connect-src names the API
    # origin because the client calls it cross-origin (VITE_API_BASE_URL);
    # style-src allows 'unsafe-inline' only for the Dashboard's inline
    # `style={{width}}` bars, nothing else. Unverified until the next deploy —
    # Render doesn't apply blueprint header changes to an existing service
    # without a redeploy.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
          img-src 'self' data:; font-src 'self'; connect-src 'self' https://talent-finder-api.onrender.com;
          frame-ancestors 'none'; base-uri 'self'; object-src 'none'

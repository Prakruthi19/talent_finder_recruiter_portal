name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: server
      # No database needed: repositories are mocked (vi.mock) per CLAUDE.md's
      # service-layer testing rule. RLS integration tests run in the job below.
      - run: npm test
        working-directory: server

  server-rls:
    name: Server — row-level security (real Postgres)
    runs-on: ubuntu-latest
    # Mirrors docs/row-level-security.md exactly, both modes: an app-role
    # connection (like local Docker, where the login is a superuser) and a
    # FORCE/table-owner connection (like a managed host such as Render).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server

      - name: Create the two scratch databases
        run: |
          psql "$ADMIN_URL" -c "CREATE DATABASE rls_local;"
          psql "$ADMIN_URL" -c "CREATE ROLE render_like LOGIN PASSWORD 'render_like' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql "$ADMIN_URL" -c "CREATE DATABASE rls_render_sim OWNER render_like;"
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGPASSWORD: postgres

      - name: Migrate rls_local (app-role mode)
        run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rls_local?schema=public
      - name: Migrate rls_render_sim (FORCE mode)
        run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://render_like:render_like@localhost:5432/rls_render_sim?schema=public

      - name: test:rls against rls_local (app-role mode)
        run: npm run test:rls
        working-directory: server
        env:
          RLS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rls_local?schema=public
          RLS_TEST_EXPECT_APP_ROLE: "true"
      - name: test:rls against rls_render_sim (FORCE mode)
        run: npm run test:rls
        working-directory: server
        env:
          RLS_TEST_DATABASE_URL: postgresql://render_like:render_like@localhost:5432/rls_render_sim?schema=public
          RLS_TEST_EXPECT_APP_ROLE: "false"

  client:
    name: Client — typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
